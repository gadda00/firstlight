global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FirstLight Application
  - job_name: 'firstlight-app'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (if added)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

# Alerting rules
rule_files:
  - 'alerts.yml'

# Recording rules
scrape_configs:
  - job_name: 'recording-rules'
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: '/api/v1/rules'
