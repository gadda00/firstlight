apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: firstlight-app-pdb
  namespace: firstlight
  labels:
    app: firstlight
    component: app
    tier: reliability
spec:
  minAvailable: 2
  maxUnavailable: 1
  selector:
    matchLabels:
      app: firstlight
      component: app
---
