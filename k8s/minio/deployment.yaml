apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firstlight-minio
  namespace: firstlight
  labels:
    app: firstlight
    component: minio
    tier: storage
spec:
  serviceName: firstlight-minio
  replicas: 1
  selector:
    matchLabels:
      app: firstlight
      component: minio
  template:
    metadata:
      labels:
        app: firstlight
        component: minio
        tier: storage
    spec:
      serviceAccountName: firstlight-minio
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: firstlight-secrets
              key: minio-root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstlight-secrets
              key: minio-root-password
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: minio-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      nodeSelector:
        kubernetes.io/arch: amd64
  volumeClaimTemplates:
  - metadata:
      name: minio-data
      labels:
        app: firstlight
        component: minio
        tier: storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 500Gi
      storageClassName: standard
