apiVersion: v1
kind: Service
metadata:
  name: firstlight-minio
  namespace: firstlight
  labels:
    app: firstlight
    component: minio
    tier: storage
spec:
  selector:
    app: firstlight
    component: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: console
    port: 9001
    targetPort: 9001
    protocol: TCP
  type: ClusterIP
