apiVersion: v1
kind: Service
metadata:
  name: firstlight-app
  namespace: firstlight
  labels:
    app: firstlight
    component: app
    tier: backend
spec:
  selector:
    app: firstlight
    component: app
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
