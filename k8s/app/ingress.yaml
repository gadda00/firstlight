apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firstlight-app
  namespace: firstlight
  labels:
    app: firstlight
    component: app
    tier: backend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: https:; frame-src 'none'; object-src 'none'" always;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      server_tokens off;
      if ($host = 'www.${HOST}') {
        return 301 https://${HOST}$request_uri;
      }
spec:
  tls:
  - hosts:
    - firstlight.example.com
    - www.firstlight.example.com
    secretName: firstlight-tls
  rules:
  - host: firstlight.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firstlight-app
            port:
              name: http
  - host: www.firstlight.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firstlight-app
            port:
              name: http
