apiVersion: v1
kind: Service
metadata:
  name: firstlight-python-worker
  namespace: firstlight
  labels:
    app: firstlight
    component: python-worker
    tier: backend
spec:
  selector:
    app: firstlight
    component: python-worker
  ports:
  - name: health
    port: 5555
    targetPort: 5555
    protocol: TCP
  type: ClusterIP
