apiVersion: v1
kind: Service
metadata:
  name: firstlight-redis
  namespace: firstlight
  labels:
    app: firstlight
    component: redis
    tier: database
spec:
  selector:
    app: firstlight
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP
