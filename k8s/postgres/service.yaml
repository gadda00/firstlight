apiVersion: v1
kind: Service
metadata:
  name: firstlight-postgres
  namespace: firstlight
  labels:
    app: firstlight
    component: postgres
    tier: database
spec:
  selector:
    app: firstlight
    component: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  type: ClusterIP
