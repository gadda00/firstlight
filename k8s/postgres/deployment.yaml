apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firstlight-postgres
  namespace: firstlight
  labels:
    app: firstlight
    component: postgres
    tier: database
spec:
  serviceName: firstlight-postgres
  replicas: 1
  selector:
    matchLabels:
      app: firstlight
      component: postgres
  template:
    metadata:
      labels:
        app: firstlight
        component: postgres
        tier: database
    spec:
      serviceAccountName: firstlight-postgres
      containers:
      - name: postgres
        image: postgis/postgis:16-3.4
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "firstlight"
        - name: POSTGRES_USER
          value: "firstlight"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firstlight-secrets
              key: postgres-password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - firstlight
            - -d
            - firstlight
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - firstlight
            - -d
            - firstlight
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      nodeSelector:
        kubernetes.io/arch: amd64
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app: firstlight
        component: postgres
        tier: database
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      storageClassName: standard
