apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-ingress
  namespace: firstlight
  labels:
    app: firstlight
    tier: monitoring
    component: security
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-prometheus
  policyTypes:
  - Ingress
  ingress:
  # Allow metrics scraping from all pods
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 9090
  # Allow access from Grafana
  - from:
    - podSelector:
        matchLabels:
          app: kube-prometheus-stack-grafana
    ports:
    - protocol: TCP
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress
  namespace: firstlight
  labels:
    app: firstlight
    tier: monitoring
    component: security
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-prometheus
  policyTypes:
  - Egress
  egress:
  # Allow scraping all pods
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000  # App metrics
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 9000  # MinIO
    - protocol: TCP
      port: 5555  # Python worker
  # Allow DNS queries
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
