# Netlify configuration — FirstLight static deploy
# Import this repo in Netlify and it works with zero extra setup.
[build]
  command = "npm run build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
